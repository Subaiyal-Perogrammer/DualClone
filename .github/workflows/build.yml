name: Build DualClone APK
# Builds CloneSpace WITH the vendored BlackBox virtualization engine (:Bcore).
# The engine needs JDK 21, Android SDK 34, CMake and exactly NDK 29.0.13846066
# (ndkBuild / Android.mk — the version is pinned in Bcore/build.gradle).
# This workflow is the build of record: the Muse sandbox has no NDK and only
# JDK 17, so it cannot build the integrated project locally.
on:
  push:
    branches: [ main, fresh-app ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # No setup-android action: its bundled sdkmanager step fails on current
      # runners ("Failed to find package 'tools'"). GitHub's ubuntu images
      # already ship an Android SDK + cmdline-tools at $ANDROID_HOME.
      - name: Install SDK platform, build-tools, CMake and the pinned NDK
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;35.0.0" "cmake;3.22.1" "ndk;29.0.13846066"

      - name: Show toolchain (for the build log)
        run: |
          java -version
          ls "$ANDROID_HOME/ndk"
          ls "$ANDROID_HOME/cmake"

      - name: Build debug APK (includes the BlackBox native engine)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-log.txt

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee -a build-log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualClone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build logs (always — paste these to Muse if the build fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DualClone-build-logs
          path: |
            build-log.txt
            app/build/reports/tests/
            app/build/outputs/logs/
